plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plpp555.trisync3d'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.plpp555.trisync3d'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                // No C++ standard library: the core is dependency-free (see docs/SPEC.md)
                arguments '-DANDROID_STL=none'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Single CMake project shared with the Linux tools and (later) Windows.
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    signingConfigs {
        // Public debug key shared by Gradle, CI and tools/build_apk_offline.sh so
        // every build can update the others. Use your own key for distribution.
        shared {
            storeFile file('../../tools/keystore/trisync-debug.jks')
            storePassword 'trisync-debug'
            keyAlias 'trisync'
            keyPassword 'trisync-debug'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
